baseURL = 'https://librenotebook.enochyu.com/'
title = 'LibreNotebook'
locale = 'en-us'

enableRobotsTXT = true
disableKinds = ["section", "taxonomy"]

[params]
author = "Enoch Yu"
  favicon = "/favicon/favicon.ico"
  [params.social]
    website = "https://enochyu.com/"
    youtube = "https://www.youtube.com/@enochness"
    github = "https://github.com/enochness/LibreNotebook"

[security]
  allowContent = ['^text/html$', '^text/markdown$']

[module]
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = '../index.yaml'
    target = 'data/index.yaml'

[outputFormats.index]
  mediaType = "text/plain"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "index"]


